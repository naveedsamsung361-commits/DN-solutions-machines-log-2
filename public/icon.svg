<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Industrial Gear / Milling Spindle Emblem -->
  <g transform="translate(256, 220)">
    <!-- Outer Gear teeth ring -->
    <circle r="130" fill="none" stroke="url(#primary)" stroke-width="24" stroke-dasharray="24 16"/>
    <!-- Inner Spindle core -->
    <circle r="90" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    <!-- CNC Milling Cutter Shape -->
    <path d="M-30,-50 L30,-50 L45,10 L15,60 L-15,60 L-45,10 Z" fill="url(#cyanGrad)"/>
    <!-- Center spindle bearing dot -->
    <circle r="16" fill="#ffffff"/>
  </g>

  <!-- Wrench Cross Indicator -->
  <path d="M160,340 L352,340" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- DN SOLUTIONS Text Badge -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DN SOLUTIONS
  </text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
    MACHINE OPS HUB
  </text>
</svg>
